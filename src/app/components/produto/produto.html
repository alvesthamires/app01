<div class="produto">
  <h2>{{ nome | uppercase }}</h2>
  @if (mostrarPreco) {
    <p>Preço: R$ {{ preco | currency:'BRL'  }}</p>
  }
</div>

@for (item of produtos; track item) {
    <div>
      <h3>{{ item.nome | uppercase }}</h3>
      <p>Preco: {{ item.preco | precoFormatado }}</p>
    </div>
  }
